<div class="container">
  <div>
    <h2>Modifier un Joueur :</h2>
  </div>

  <form>
    <div hidden class="col-sm-2 col-md-2 col-lg-2">
      <label>Numéro Joueur</label>
      <input readonly type="text" [(ngModel)]="currentJoueur.numerojoueur"
             name="numerojoueur" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Joueur</label>
      <input type="text" [(ngModel)]="currentJoueur.nomjoueur"
             name="nomjoueur" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Joueur</label>
      <input type="number" [(ngModel)]="currentJoueur.prixjoueur"
             name="prixjoueur" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date de naissance</label>
      <input type="date" [ngModel]="currentJoueur.datedenaissance | date: 'yyyy-MM-dd'"
             (ngModelChange)="currentJoueur.datedenaissance = $event"
             name="datedenaissance" class="form-control">
    </div>

    <div class="mt-2">
      <button type="submit" (click)="updateJoueur()" class="btn btn-success">Modifier</button>
    </div>
  </form>
</div>
