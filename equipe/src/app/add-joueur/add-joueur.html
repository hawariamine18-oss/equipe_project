<div class="container">
  <div>
    <h2>Ajouter un Joueur :</h2>
  </div>

  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Numéro Joueur</label>
      <input type="text" [(ngModel)]="newJoueur.numerojoueur"
             name="numerojoueur" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Joueur</label>
      <input type="text" [(ngModel)]="newJoueur.nomjoueur"
             name="nomjoueur" class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Joueur</label>
      <input type="number" [(ngModel)]="newJoueur.prixjoueur"
             name="prixjoueur" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date de naissance</label>
      <input type="date" [(ngModel)]="newJoueur.datedenaissance"
             name="datedenaissance" class="form-control">
    </div>
   
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Niveau</label>
      <select class="form-control form-control-lg" id="idNiv" name="idNiv"[(ngModel)]="newIdNiv">
      @for(niv of niveaux; track niv.idNiv){
      <option [value]="niv.idNiv"> {{niv.nomNiv}} </option>
      }
   
   
    </select>
    </div>

    <div class="mt-2">
      <button type="submit" (click)="addJoueur()" class="btn btn-success">Ajouter</button>
    </div>

    <div class="mt-2">
      <h3>{{ message }}</h3>
    </div>
  </form>
</div>
